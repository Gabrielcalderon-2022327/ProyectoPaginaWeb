    <h1>Natacion</h1>
    <p>
    La natación es una actividad física y un deporte que consiste en desplazarse en el agua usando los brazos
    y las piernas. Se practica en piscinas, ríos, lagos o el mar, y puede hacerse con fines recreativos, de
    salud o competitivos.
